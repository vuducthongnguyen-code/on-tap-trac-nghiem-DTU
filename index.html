<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KST Quiz – Trắc nghiệm Ký sinh trùng</title>
<style>
:root{--bg:#cfcfd2;--shell:#fff;--main:#efefef;--card:#fff;--ink:#111;--mut:#777;--chip:#e8e8e8;--line:#ececec;--ok:#1f9d55;--no:#d64545;--okbg:#e3f5ea;--nobg:#fbe6e6;--inv:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c0c0d;--shell:#1a1a1c;--main:#121213;--card:#1f1f21;--ink:#f2f2f2;--mut:#9a9a9f;--chip:#2b2b2e;--line:#2a2a2d;--okbg:#14301f;--nobg:#3a1c1c}}
:root[data-theme=dark]{--bg:#0c0c0d;--shell:#1a1a1c;--main:#121213;--card:#1f1f21;--ink:#f2f2f2;--mut:#9a9a9f;--chip:#2b2b2e;--line:#2a2a2d;--okbg:#14301f;--nobg:#3a1c1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{max-width:1180px;margin:22px auto;background:var(--shell);border-radius:34px;display:flex;overflow:hidden;min-height:calc(100vh - 44px);box-shadow:0 20px 60px #0002}
aside{width:230px;padding:28px 20px;display:flex;flex-direction:column;flex:none}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;padding:0 8px 34px;display:flex;align-items:center;gap:8px}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--shell);display:grid;place-items:center;font-style:normal;font-size:15px}
nav{display:flex;flex-direction:column;gap:10px}
nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--mut);font:inherit;padding:6px;border-radius:30px;cursor:pointer;text-align:left}
nav button b{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:15px;flex:none}
nav button.on{background:linear-gradient(90deg,#000,#333);color:#fff;font-weight:600;padding-right:18px}
nav button.on b{background:#fff;color:#000}
.me{margin-top:auto;text-align:center;padding-top:24px}
.av{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--shell);display:grid;place-items:center;margin:0 auto 6px;font-weight:700}
.me small{display:block;color:var(--mut)}.me a{color:var(--mut);font-size:12px;cursor:pointer;text-decoration:underline}
main{flex:1;background:var(--main);border-radius:28px 0 0 28px;padding:26px;min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border-radius:26px;padding:22px 24px}
h2{margin:0 0 4px;font-size:21px;letter-spacing:-.3px}.mut{color:var(--mut)}
.top{display:flex;gap:14px;align-items:stretch}.top .intro{width:170px;flex:none;padding-top:10px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;flex:1}
.st{background:var(--card);border-radius:30px;padding:18px 8px 16px;text-align:center}
.st .ic{width:42px;height:42px;border-radius:50%;background:var(--chip);margin:0 auto 10px;display:grid;place-items:center}
.st.dark .ic{background:#000;color:#fff}.st b{display:block;font-size:22px}.st span{font-size:12px;color:var(--mut)}
.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.chart{display:flex;align-items:flex-end;gap:8px;height:190px;margin-top:16px;border-bottom:1px solid var(--line);padding:0 4px}
.chart div{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%}
.chart i{display:block;width:9px;border-radius:6px 6px 0 0;min-height:3px}
.lab{display:flex;gap:8px;padding:6px 4px;font-size:11px;color:var(--mut)}.lab span{flex:1;text-align:center}
.lg{font-size:12px;color:var(--mut);display:flex;gap:14px;margin-top:6px}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pend{display:flex;align-items:center;gap:12px;padding:11px 0}.pend p{margin:0;flex:1;font-size:13px;line-height:1.35}
.pill{border:0;background:var(--chip);color:var(--ink);border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.pill.dk,.btn{background:#000;color:#fff}.btn{border:0;border-radius:24px;padding:12px 24px;font:inherit;font-weight:600;cursor:pointer}
:root[data-theme=dark] .pill.dk,:root[data-theme=dark] .btn{background:#f2f2f2;color:#111}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pill.dk,:root:not([data-theme=light]) .btn{background:#f2f2f2;color:#111}}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.o{display:flex;gap:14px;align-items:center;padding:13px 16px;border-radius:18px;background:var(--main);border:2px solid transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.o b{width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none;font-size:13px}
.o:hover{border-color:var(--ink)}.o.ok{background:var(--okbg);border-color:var(--ok)}.o.no{background:var(--nobg);border-color:var(--no)}.o.lock{cursor:default}.o.lock:hover{border-color:transparent}.o.ok:hover{border-color:var(--ok)}.o.no:hover{border-color:var(--no)}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:8px;transition:width .3s}
.q{font-size:19px;font-weight:700;line-height:1.4;margin:14px 0 0}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px;align-items:center}.opt-row .pill.on{background:#000;color:#fff}
.tag{display:inline-block;margin-top:8px;font-size:12px;background:var(--chip);color:var(--mut);border-radius:12px;padding:3px 10px}.nt{background:var(--chip);border-radius:14px;padding:10px 14px;font-size:13px;margin:0 0 14px}.big{font-size:56px;font-weight:800;letter-spacing:-2px}
.wr{border-top:1px solid var(--line);padding:12px 0;font-size:14px}.wr em{font-style:normal;color:var(--ok);font-weight:600}
@media(max-width:900px){.shell{flex-direction:column;margin:0;border-radius:0;min-height:100vh}aside{width:auto;padding:16px}.logo{padding-bottom:12px}nav{flex-direction:row;overflow-x:auto}nav button{flex:none}.me{display:none}main{border-radius:28px 28px 0 0;padding:14px}.top{flex-direction:column}.top .intro{width:auto}.stats{grid-template-columns:repeat(3,1fr)}.row2{grid-template-columns:1fr}}
</style></head><body><div class="shell"><aside><div class="logo"><i>◆</i>KST Quiz</div><nav id="nav"></nav><div class="me"><div class="av">T</div><b>Nguyễn Thông</b><small>Ôn thi Ký sinh trùng</small><a id="rs">Xóa tiến độ</a></div></aside><main id="m"></main></div>
<script>
const Q=[{"q":"KST nào sau đây không tìm thấy đối với kỹ thuật KATO:","o":["Trứng giun đũa","Trứng giun tóc","Trứng và ấu trùng giun móc","Trứng sán lá ruột","Bào nang và thể hoạt động amip"],"a":4},{"q":"Thể giao bào của KST vivax khác falciparum ở đặc điểm nào?","o":["Có hình nhẫn","Có hình cầu","Có hình quả chuối","Có chứa nhiều mảnh trùng","Hồng cầu bị biến dạng"],"a":1},{"q":"Đặc điểm nhận dạng của trứng và bọ gậy aedes với các giống muỗi khác?","o":["Trứng có phao, bọ gậy có ống thở","Trứng kết bè, không có ống thở","Trứng rời rạc, bọ gậy có ống thở","Trứng rời rạc, bọ gậy không có ống thở","Trứng có phao, bọ gậy cắm ống thở vào vỏ bèo"],"a":2},{"q":"Ấu trùng giun mỏ lây nhiễm vào cơ thể người bằng:","o":["Qua món gỏi cá","Do ăn thịt lợn chưa chín","Chui qua da khi người bơi trong nước","Bám ngọn cỏ và chui qua da","Do ăn phải ấu trùng trong rau sống"],"a":3},{"q":"Loài nào dưới đây xâm nhập vào người qua da?","o":["Giun đầu gai, sán kim","Sán lá gan lớn, sán kim","Giun bao, sán dây lợn","Sán kim, giun kim","Giun lươn, sán máng"],"a":4},{"q":"Dựa vào chu kỳ phát triển thì phân chia KST thành những loại nào?","o":["Ngoại – Nội ký sinh","KST tạm thời – vĩnh viễn","KST gây bệnh – truyền bệnh","Vật chủ chính – phụ","Tư dưỡng – bào nang"],"a":1},{"q":"Nếu ăn phải thịt lợn có chứa ấu trùng của sán dây lợn còn sống thì:","o":["Ấu trùng làm tổ trong cơ, não","Ấu trùng ký sinh trong phổi","Phát triển thành con trưởng thành ở gan","Phát triển thành con trưởng thành ở ruột","Ấu trùng tạo nang dưới da"],"a":3},{"q":"Điều trị ấu trùng sán dây lợn/ bò ký sinh ở vỏ não như thế nào?","o":["Praziquantel(viên nén 600mg)","Albendazole, liều duy nhất","Mebendazole, liều duy nhất","Phải có tư vấn của chuyên gia","Uống thuốc tẩy giun sán thông thường"],"a":3},{"q":"Thể giao bào của KST sốt rét P.falciparum khác với P.vivax ở đặc điểm nào?","o":["Có hình nhẫn","Có hình cầu","Có hình quả chuối","Hồng cầu bị biến dạng","Có nhiều mảnh trùng bên trong"],"a":2},{"q":"Vì sao muỗi là vật chủ chính của KST sốt rét Plasmodium?","o":["Có thể giao bào dực và giao bào cái","Có thoa trùng trong tuyến nước bọt","Có các thể tư dưỡng, phân liệt","Có mang dị noãn trong dạ dày"],"a":1},{"q":"Thuốc nào sau đây có tác dụng diệt thể ngủ của KST sốt rét Plasmodium vivax:","o":["Primaquin","Chloroquin","Pirymethamin","Mefloquin","Artemisinin"],"a":0},{"q":"Nếu ăn phải trứng giun móc/ giun mỏ thì:","o":["Bị hội chứng Loeffler do ấu trùng vào phổi","Đau nhức cơ do ấu trùng ký sinh trong cơ vân","Phát triển thành con trưởng thành ở lòng ruột","Ấu trùng chui lên não gây động kinh","Làm tổ trong gan,phổi"],"a":2},{"q":"Đặc điểm chung của sán dây","o":["Cơ thể dẹt, hình lá","Cơ thể hình ống","Cơ thể dẹt, phân đốt","Phát triển qua nhiều vật chủ","Phân tính thành con đực, cái"],"a":2},{"q":"Khi soi phân tìm thấy trứng có dạng tròn, hai lớp vỏ dày, giữa các lớp vỏ có tia(khía) thì đó là trứng của loài KST nào?","o":["Giun đũa","Sán dây lợn","Sán dây cá","Sán lá gan lớn","Giun tóc"],"a":1},{"q":"Điều nào sau đây không đúng với bệnh sốt rét?","o":["Mắc sốt rét do muỗi anopheles đốt","Mắc sốt rét khi bị nhiễm KST Plasmodium","Có thể lây truyền qua tiếp xúc với nhau","Người đã bị sốt rét có thể bị nhiễm sốt rét trở lại","Bị nhiễm sốt rét do truyền máu"],"a":2},{"q":"Soi phân tìm thấy trứng hình bầu dục, đầu mút hơi nhọn và có một gai lớn ở bên thì là trứng của loài KST:","o":["Giun đũa","Giun tóc","Sán dây lợn","Sán máng","Giun móc"],"a":3},{"q":"Loài giun sán nào có thể phát triển hoàn hoàn ngoài tự nhiên thành con trưởng thành:","o":["Sán máng","Sán dây cá","Giun chỉ bạch huyết","Giun lươn","Giun đầu gai"],"a":3},{"q":"Loài KST nào có thể bò ra hậu môn của vật chủ gây ngứa ngáy khó chịu?","o":["Giun kim, sán máng","Giun đầu gai, sán dây lợn","Giun kim, sán kim","Sán lá gan lớn, sán lá phổi","Giun tóc, giun móc"],"a":2},{"q":"Trứng giun móc khác với trứng giun kim ở điểm nào?","o":["Có hai lớp vỏ dày, có tia","Bên trong có ấu trùng","Vỏ có 1 lớp","Vỏ có 2 lớp","Trứng lép 1 bên"],"a":2},{"q":"Trứng giun tóc có đặc điểm:","o":["Vỏ nhẵn, lép 1 bên","Hình của cau, núm 2 đầu","Có nắp, có gai ở cuối","Vỏ có 2 lớp, có tia","Vỏ mỏng, có ấu trùng bên trong"],"a":1},{"q":"Các vật chủ của sán lá gan nhỏ:","o":["Ốc, tôm nước ngọt, người","Ốc cua nước ngọt, người","Ốc, cá biển, người","Ốc, cá nước ngọt, người","Côn trùng, ếch nhái, người"],"a":3},{"q":"Đặc điểm hình thể của loài giun đũa","o":["Cơ thể ngắn 3-4 đốt, sốt cuối phình to","Cơ thể dẹt, phân đốt, đầu có 2 vòng móc","Cơ thể hình ống, đầu có vòi dài nhiều gai nhọn","Cơ thể hình ống tròn, đầu có 3 môi phát triển","Cơ thể dẹt, nhô lên ở trước, có 2 giác gần nhau"],"a":3},{"q":"Những đặc điểm chung của bệnh học KST, ngoại trừ:","o":["Phổ biến theo vùng","Gây tiêu chảy, gầy yếu, thiếu máu","Diễn biến thầm lặng","Nhầm lẫn với các bệnh khác","Thường kéo dài"],"a":1},{"q":"Thuốc đặc hiệu điều trị sán lá gan lớn:","o":["Triclabendazol","Albendazole","Praziquantel","Astermisine","Mebendazole"],"a":0},{"q":"Ăn cá chưa chín có thể bị nhiễm loài KST nào?","o":["Giun đũa","Giun tròn Anisakis","Giun đầu gai","Sán kim","Sán máng"],"a":1},{"q":"Đặc điểm nào sau đây không phải là hội chứng Loeffler:","o":["Ho, ho khan, sau có đờm","Đau ngực (có thể đau dữ dội)","Đờm có nhiều trứng giun","Nhiều nốt thâm nhiễm ở phổi","Bạch cầu ái toan tăng cao"],"a":2},{"q":"Điều trị bệnh sán kim như thế nào?","o":["Phẫu thuật bóc tách nang sán","Albendazole, liều duy nhất","Mebendazole, liều duy nhất","Praziquantel(viên nén 600mg)","Astermisine, theo phác đồ điều trị"],"a":0},{"q":"Loài nào dưới đây có thể gây ra hội chứng Loeffler?","o":["Sán máng, giun đũa","Plasmodium, sán lá gan lớn","Giun đũa, giun bao","Giun lươn, sán lá phổi","Sán dây lợn, sán lá gan nhỏ"],"a":2},{"q":"Triệu chứng lâm sàng thường gặp của người bị bệnh sán lá gan lớn","o":["Đau nhức cơ, xương","Đau hạ sườn phải","Bị gầy yếu, thiếu máu, tiêu chảy","Có triệu chứng giống lao phổi","Phù mí mắt, đau nhức cơ xương"],"a":1},{"q":"Loài KST nào có thể tạo nang sán ở vỏ não người?","o":["Sán dây lợn, giun bao","Sán dây lợn, sán kim","Sán lá gan lớn, giun lươn","Sán máng, giun đầu gai","Plasmodium, giun chỉ bạch huyết"],"a":1},{"q":"Côn trùng là vật chủ trung gian của:","o":["Sán lá gan lớn","Giun móc/ giun mỏ","Sán lá phổi","Giun đầu gai","Giun đũa"],"a":3},{"q":"Ấu trùng của loài KST nào có thể ký sinh ở vỏ não?","o":["Sán lá gan lớn","Sán máng","Giun chỉ bạch huyết","Giun kim","Sán kim"],"a":4},{"q":"Giun chỉ bạch huyết lây nhiễm vào người là do:","o":["Ấu trùng chui qua da","Muỗi truyền","Ăn phải thịt lợn chưa chín","Ăn gỏi cá sống","Ăn mực sống"],"a":1},{"q":"Xét nghiệm phân và dịch mật để tìm trứng sán lá gan lớn cần phải tiến hành:","o":["Trong 1 ngày","Trong 2 ngày liên tục","Trong 3 ngày liên tục","Soi phân ttừ 3-5 lần","Lấy mẫu theo chu kỳ sốt"],"a":2},{"q":"Giun tròn khác với sán lá, sán dây ở đặc điểm nào?","o":["Cơ thể phân đốt","Lưỡng tính","Có giác hút","Phân tính đực, cái","Đẻ nhiều trứng"],"a":3},{"q":"Sán dây sinh sản như thế nào?","o":["Sinh sản bằng cách phân chia cơ thể","Con đực, cái giao phối sinh ra con non","Các đốt cuối thân chứa trứng rụng ra","Con cái đẻ trứng từ lỗ giữa cơ thể","Sinh sản vô tính bằng cách phân chia cơ thể"],"a":2},{"q":"Sán dây lợn khác sán dây bò ở đặc điểm:","o":["Đầu có 4 giác bám","Đầu có 2 vòng móc bám","Ấu trùng ký sinh ở cơ","Sống ký sinh trong ruột","Thân có nhiều đốt"],"a":1},{"q":"Cercaria có đuôi là dạng ấu trùng của loài nào?","o":["Sán dây lợn","Sán dây cá","Giun đũa","Giun đầu gai","Sán lá gan lớn"],"a":4},{"q":"Vì sao bệnh giun kim thường có tính tajao thể (bị nhiễm ở nhiều người trong 1 gia đình hoặc trường học)?","o":["Giun kim có khả năng chui qua da","Do muỗi truyền từ người này qua người khác","Do người ăn phải thịt lợn bị nhiễm bệnh","Trứng giun kim nhẹ, lơ lửng trong không khí","Chuột là vật chủ chứa làm lây lan"],"a":3},{"q":"Xét nghiệm nước tiểu có thể phát hiện trứng của những loài KST nào?","o":["Giun đũa","Sán lá gan lớn","Sán dây lợn","Sán máng","Giun đ function start(mode,ids){let pool=ids||Q.map((_,i)=>i);if(!ids){if(mode==='wrong')pool=wrongIds();if(mode==='new')pool=pool.filter(i=>!S[i])}
 if(cfg.shuf||mode==='wrong')pool=pool.sort(()=>Math.random()-.5);if(!ids&&cfg.n&&mode!=='wrong')pool=pool.slice(0,cfg.n);
 sess={ids:pool,i:0,a:[],fin:false};view='quiz';render()}

function home(){const d=doneIds(),r=d.filter(i=>S[i].l===1).length,w=d.length-r,pc=d.length?Math.round(r/d.length*100):0;
 const sts=[['☰',Q.length,'Tổng số câu'],['✓',d.length,'Đã làm'],['★',r,'Làm đúng',1],['✕',w,'Làm sai'],['%',pc+'%','Tỉ lệ đúng']];

  bars+=`<div><i style="height:${dn/ids.length*100}%;background:var(--chip)"></i><i style="height:${ok/ids.length*100}%;background:var(--ink)"></i></div>`;labs+=`<span>${g*G+1}</span>`}

 return `<div class="top"><div class="intro"><h2>Tổng quan</h2><span class="mut">Tiến độ ôn tập của bạn.</span></div><div class="stats">${sts.map(s=>`<div class="st ${s[3]?'dark':''}"><div class="ic">${s[0]}</div><b>${s[1]}</b><span>${s[2]}</span></div>`).join('')}</div></div>
 <div class="row2"><div class="card"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><h2>Thống kê</h2><div class="lg"><span><i style="background:var(--ink)"></i>Đúng</span><span><i style="background:var(--chip)"></i>Đã làm</span></div></div><div class="chart">${bars}</div><div class="lab">${labs}</div><div class="mut" style="font-size:12px">Mỗi cột là 20 câu (số dưới cột là câu bắt đầu)</div></div>
 <div class="card"><h2>Câu sai cần ôn</h2>${wi.length?wi.map(i=>`<div class="pend"><p>${esc(Q[i].q.slice(0,70))}${Q[i].q.length>70?'…':''}</p><button class="pill" data-one="${i}">Ôn</button></div>`).join(''):'<p class="mut">Chưa có câu sai nào. Hãy bắt đầu làm bài!</p>'}${wrongIds().length?`<button class="pill dk" data-k="wrong">Ôn tất cả ${wrongIds().length} câu sai</button>`:''}</div></div>
 <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2>Sẵn sàng làm bài?</h2><span class="mut">${Q.length} câu trắc nghiệm, chấm đáp án ngay khi chọn.</span></div><button class="btn" data-k="quiz">Bắt đầu làm bài →</button></div>`}
function pills(key,opts){return opts.map(([v,t])=>`<button class="pill ${cfg[key]===v?'on':''}" data-c="${key}" data-v="${v}">${t}</button>`).join('')}
function setup(){return `<div><h2>Làm bài</h2><span class="mut">Chọn cách làm rồi bắt đầu.</span></div><div class="card"><b>Câu hỏi</b><div class="opt-row">${pills('mode',[['all','Tất cả'],['new','Chưa làm'],['wrong','Câu sai']])}</div><b>Số câu</b><div class="opt-row">${pills('n',[[10,'10'],[20,'20'],[50,'50'],[0,'Tất cả']])}</div><b>Thứ tự</b><div class="opt-row">${pills('shuf',[[true,'Xáo trộn'],[false,'Theo đề']])}</div><button class="btn" id="go">Bắt đầu</button></div>`}
function empty(){return `<div><h2>Câu sai</h2></div><div class="card"><p class="mut">Bạn chưa có câu sai nào để ôn. Hãy làm bài trước nhé.</p><button class="btn" data-k="quiz">Làm bài</button></div>`}
function quiz(){const id=sess.ids[sess.i],q=Q[id],a=sess.a[sess.i],pr=sess.i/sess.ids.length*100;
 return `<div class="card"><div style="display:flex;justify-content:space-between" class="mut"><span>Câu ${sess.i+1}/${sess.ids.length}</span><span>Đúng: ${sess.a.filter((x,k)=>x===Q[sess.ids[k]].a).length}</span></div><div class="bar" style="margin-top:8px"><i style="width:${pr}%"></i></div><p class="q">${esc(q.q)}</p>${q.ai?'<span class="tag">Claude giải · bạn nên kiểm tra lại</span>':''}<div class="opts">${q.o.map((t,k)=>`<button class="o ${a!==undefined?'lock '+(k===q.a?'ok':k===a?'no':''):''}" data-p="${k}"><b>${L[k]}</b>${esc(t)}</button>`).join('')}</div>${a!==undefined&&q.n?`<p class="nt">💡 ${esc(q.n)}</p>`:''}<div style="display:flex;justify-content:space-between;gap:10px"><button class="pill" data-k="home">Thoát</button><button class="btn" id="nx" ${a===undefined?'disabled':''}>${sess.i+1<sess.ids.length?'Câu tiếp →':'Xem kết quả'}</button></div></div>`}
function result(){const ok=sess.ids.filter((id,k)=>sess.a[k]===Q[id].a),bad=sess.ids.filter((id,k)=>sess.a[k]!==Q[id].a);
 return `<div class="card"><h2>Kết quả</h2><div class="big">${ok.length}/${sess.ids.length}</div><span class="mut">${Math.round(ok.length/sess.ids.length*100)}% câu đúng</span><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="again">Làm lại</button>${bad.length?`<button class="pill dk" id="rw">Ôn ${bad.length} câu sai</button>`:''}<button class="pill" data-k="home">Tổng quan</button></div></div>${bad.length?`<div class="card"><h2>Câu làm sai</h2>${bad.map(id=>`<div class="wr">${esc(Q[id].q)}<br><em>Đáp án: ${L[Q[id].a]}. ${esc(Q[id].o[Q[id].a])}</em></div>`).join('')}</div>`:''}`}
function pick(k){if(sess.a[sess.i]!==undefined)return;const id=sess.ids[sess.i];sess.a[sess.i]=k;const o=S[id]||{r:0,w:0};k===Q[id].a?o.r++:o.w++;o.l=k===Q[id].a?1:0;S[id]=o;save();render()}
function next(){if(sess.a[sess.i]===undefined)return;sess.i++;if(sess.i>=sess.ids.length)sess.fin=true;render()}
function bind(){document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(b.dataset.k));
 document.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>start('wrong',[+b.dataset.one]));
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const v=b.dataset.v;cfg[b.dataset.c]=v==='true'?true:v==='false'?false:isNaN(v)?v:+v;render()});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>pick(+b.dataset.p));
 const g=$('#go');if(g)g.onclick=()=>{if(cfg.mode==='wrong'&&!wrongIds().length){go('wrong');return}start(cfg.mode)};
 const n=$('#nx');if(n)n.onclick=next;const a=$('#again');if(a)a.onclick=()=>start('all',sess.ids.slice());const r=$('#rw');if(r)r.onclick=()=>start('wrong')}
$('#rs').onclick=function(){if(!resetArm){resetArm=true;this.textContent='Bấm lại để xác nhận xóa';setTimeout(()=>{resetArm=false;this.textContent='Xóa tiến độ'},3000);return}S={};save();resetArm=false;this.textContent='Xóa tiến độ';go('home')};
document.addEventListener('keydown',e=>{if(view!=='quiz'||!sess||sess.fin)return;const k=L.indexOf(e.key.toUpperCase());if(e.key.length===1&&k>=0&&k<Q[sess.ids[sess.i]].o.length)pick(k);else if(e.key==='Enter')next()});
render();
</script></body></html>
